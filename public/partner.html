<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Hururuk Partner Console</title>
<meta name="robots" content="noindex">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Black+Han+Sans&family=IBM+Plex+Sans+KR:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --canvas:#F1F2F7; --paper:#FFFFFF; --ink:#1B1D2A; --ink-2:#4F546B; --rule:#D8DAE5;
  --line:#1B1D2A; --brand:#3D3BF3; --brand-soft:#E4E4FF; --on-brand:#FFFFFF;
  --bubble:#FFE14D; --on-bubble:#1B1D2A; --good:#11795A; --warn:#B4400B; --track:#E6E7F0;
  color-scheme:light;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --canvas:#111219; --paper:#1A1C27; --ink:#ECEDF5; --ink-2:#A6AAC0; --rule:#2F3243;
    --line:#4A4E66; --brand:#8584FF; --brand-soft:#26264F; --on-brand:#111219;
    --bubble:#FFE14D; --on-bubble:#1B1D2A; --good:#4CD3A4; --warn:#FF9A63; --track:#272A3A;
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --canvas:#111219; --paper:#1A1C27; --ink:#ECEDF5; --ink-2:#A6AAC0; --rule:#2F3243;
  --line:#4A4E66; --brand:#8584FF; --brand-soft:#26264F; --on-brand:#111219;
  --bubble:#FFE14D; --on-bubble:#1B1D2A; --good:#4CD3A4; --warn:#FF9A63; --track:#272A3A;
  color-scheme:dark;
}
*,*::before,*::after{box-sizing:inherit}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--canvas);color:var(--ink);
  font-family:"IBM Plex Sans KR","Apple SD Gothic Neo","Malgun Gothic",system-ui,sans-serif;
  font-size:15px;line-height:1.55;-webkit-font-smoothing:antialiased}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--paper)}
.display{font-family:"Black Han Sans","IBM Plex Sans KR","Apple SD Gothic Neo",sans-serif;font-weight:400;letter-spacing:.005em}
.num{font-variant-numeric:tabular-nums}
.wrap{max-width:1080px;margin:0 auto;padding:0 20px}
button,input,select{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--brand);outline-offset:2px}

/* header */
header{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--paper);border-bottom:2px solid var(--line)}
.bar{display:flex;align-items:center;gap:14px;padding:12px 0}
.logo{display:flex;align-items:center;gap:10px;text-decoration:none;color:var(--ink)}
.mark{position:relative;background:var(--brand);color:var(--on-brand);font-size:15px;line-height:1;padding:7px 9px;border-radius:8px}
.mark::after{content:"";position:absolute;left:8px;bottom:-6px;border:6px solid transparent;border-top-color:var(--brand);border-bottom:0}
.logo b{font-size:22px}
.logo small{color:var(--ink-2);font-size:13px;border-left:1px solid var(--rule);padding-left:10px}
.spacer{flex:1}
.partner{font-size:13px;color:var(--ink-2)}
.partner strong{color:var(--ink);font-weight:600}
.lang{display:flex;border:2px solid var(--line);border-radius:999px;overflow:hidden}
.lang button{background:none;border:0;padding:4px 11px;font-size:13px;cursor:pointer}
.lang button[aria-pressed="true"]{background:var(--ink);color:var(--paper)}
nav{display:flex;gap:4px;overflow-x:auto;padding:0 0 10px;scrollbar-width:none}
nav::-webkit-scrollbar{display:none}
nav button{flex:none;background:none;border:2px solid transparent;border-radius:6px;padding:6px 12px;cursor:pointer;color:var(--ink-2);font-weight:500}
nav button:hover{color:var(--ink)}
nav button[aria-current="page"]{background:var(--ink);color:var(--paper);border-color:var(--ink)}

main{padding:28px 0 40px}
section[hidden]{display:none}
h2{font-size:26px;line-height:1.2;margin:0 0 6px}
h3{font-size:16px;margin:0 0 4px;font-weight:700}
.lede{color:var(--ink-2);margin:0 0 20px;max-width:62ch}
.sample{display:inline-block;font-size:12px;font-weight:600;color:var(--warn);border:1.5px solid currentColor;border-radius:4px;padding:1px 7px;margin-bottom:12px}

.panel{background:var(--paper);border:2px solid var(--line);border-radius:6px;padding:20px}
.quiet{background:var(--paper);border:1px solid var(--rule);border-radius:10px;padding:16px 18px}
.grid{display:grid;gap:14px}
.two{grid-template-columns:1.3fr 1fr}
@media (max-width:820px){.two{grid-template-columns:1fr}}

/* hero bubble */
.hero{position:relative;background:var(--bubble);color:var(--on-bubble);border:2px solid #1B1D2A;border-radius:22px;
  padding:28px 28px 26px;box-shadow:7px 7px 0 var(--brand);margin:0 0 30px}
.hero::after{content:"";position:absolute;left:48px;bottom:-22px;width:30px;height:22px;background:var(--bubble);
  border-right:2px solid #1B1D2A;border-bottom:2px solid #1B1D2A;transform:skewX(-35deg);border-bottom-right-radius:4px}
.hero h1{font-size:clamp(24px,3.6vw,38px);line-height:1.18;margin:0 0 10px;max-width:24ch}
.hero p{margin:0 0 18px;max-width:56ch}
.hbars{display:grid;gap:8px;margin:0 0 18px;max-width:640px}
.hbar{display:grid;grid-template-columns:minmax(120px,210px) 1fr auto;align-items:center;gap:10px;font-size:14px}
.hbar .t{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.hbar .track{height:14px;background:rgba(27,29,42,.12);border-radius:3px;overflow:hidden}
.hbar .fill{height:100%;background:#1B1D2A}
.hbar .tag{font-size:11px;font-weight:700;background:#1B1D2A;color:var(--bubble);border-radius:3px;padding:1px 6px;margin-left:6px;vertical-align:1px}
.btn{display:inline-flex;align-items:center;gap:8px;background:var(--ink);color:var(--paper);border:2px solid var(--ink);border-radius:6px;padding:9px 16px;font-weight:600;cursor:pointer}
.hero .btn{background:#1B1D2A;color:#FFE14D;border-color:#1B1D2A}
.btn.alt{background:var(--brand);border-color:var(--brand);color:var(--on-brand)}

.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:12px;margin:0 0 14px}
.stat .v{font-size:28px;font-weight:700;line-height:1.1;margin-top:4px}
.stat .k{font-size:13px;color:var(--ink-2)}
.stat .d{font-size:12px;color:var(--good);margin-top:4px}

.chart svg{width:100%;height:auto;display:block}
.pipe-mini{display:grid;gap:12px}
.pm{display:grid;grid-template-columns:44px 1fr;gap:12px;align-items:center}

/* covers */
.cover{position:relative;width:56px;aspect-ratio:3/4;border-radius:4px;border:1.5px solid var(--line);overflow:hidden;flex:none}
.cover::before{content:"";position:absolute;inset:45% 0 0;background-image:radial-gradient(var(--c2) 1.1px,transparent 1.5px);background-size:5px 5px}
.cover span{position:absolute;left:4px;right:4px;top:5px;font-family:"Black Han Sans","IBM Plex Sans KR",sans-serif;font-size:9px;line-height:1.1;color:var(--c2)}
.cover.sm{width:44px}
.cover img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;z-index:1}

/* demand */
.picker{display:flex;flex-wrap:wrap;gap:8px;margin:0 0 16px}
.picker button{background:var(--paper);border:2px solid var(--rule);border-radius:999px;padding:5px 13px;cursor:pointer;font-size:14px}
.picker button[aria-pressed="true"]{border-color:var(--ink);background:var(--ink);color:var(--paper)}
.big{font-size:40px;font-weight:700;line-height:1}
.cbars{display:grid;gap:9px;margin-top:14px}
.cbar{display:grid;grid-template-columns:130px 1fr 64px;gap:10px;align-items:center;font-size:14px}
.cbar .track{height:12px;background:var(--track);border-radius:3px;overflow:hidden}
.cbar .fill{height:100%;background:var(--brand)}
.cbar .n{text-align:right}
.range{width:100%;accent-color:var(--brand);margin:10px 0 2px}
.rlabel{display:flex;justify-content:space-between;align-items:baseline;gap:10px}
.rlabel output{font-size:22px;font-weight:700}
.rec{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-top:16px}
.rec div{border-top:2px solid var(--line);padding-top:8px}
.rec .k{font-size:12px;color:var(--ink-2)}
.rec .v{font-size:20px;font-weight:700}
.rec .hi .v{color:var(--brand)}
.note{font-size:12.5px;color:var(--ink-2);margin:14px 0 0;max-width:70ch}
@media (max-width:560px){.rec{grid-template-columns:1fr}.cbar{grid-template-columns:96px 1fr 56px}}

/* titles */
.rows{display:grid;gap:10px}
.row{display:grid;grid-template-columns:56px minmax(0,1.2fr) minmax(0,1.5fr) 120px;gap:16px;align-items:center;background:var(--paper);border:1px solid var(--rule);border-radius:10px;padding:12px 16px}
.row .meta{font-size:13px;color:var(--ink-2)}
.row .vw{text-align:right}
.row .vw b{display:block;font-size:17px}
.row .vw span{font-size:12px;color:var(--ink-2)}
.steps{display:grid;grid-template-columns:repeat(4,1fr);gap:4px}
.steps i{display:block;height:8px;border-radius:2px;background:var(--track)}
.steps i.done{background:var(--brand)}
.steps i.now{background:repeating-linear-gradient(-45deg,var(--brand) 0 4px,var(--brand-soft) 4px 8px)}
.slabels{display:grid;grid-template-columns:repeat(4,1fr);gap:4px;font-size:11px;color:var(--ink-2);margin-top:5px}
.slabels .cur{color:var(--ink);font-weight:600}
@media (max-width:720px){.row{grid-template-columns:56px 1fr}.row .pipe,.row .vw{grid-column:1/-1}.row .vw{text-align:left}}

/* form */
form{display:grid;gap:16px;max-width:620px}
label.f{display:grid;gap:6px;font-weight:600;font-size:14px}
input[type=text],input[type=number],select{background:var(--paper);border:2px solid var(--line);border-radius:6px;padding:9px 11px;font-weight:400;width:100%}
.frow{display:grid;grid-template-columns:1fr 1fr;gap:14px}
@media (max-width:560px){.frow{grid-template-columns:1fr}}
fieldset{border:0;padding:0;margin:0;display:grid;gap:8px}
legend{font-weight:600;font-size:14px;margin-bottom:6px}
.opt{display:flex;gap:9px;align-items:flex-start;font-size:14px;cursor:pointer}
.opt input{margin-top:4px;accent-color:var(--brand)}
.cost{display:flex;justify-content:space-between;align-items:center;gap:10px;background:var(--brand-soft);border-radius:8px;padding:12px 14px;font-weight:600}
.cost b{font-size:20px;color:var(--brand)}
.err{color:var(--warn);font-size:14px;min-height:1.4em;margin:0}

/* settlement */
table{width:100%;border-collapse:collapse;font-size:14px}
th,td{text-align:left;padding:10px 8px;border-bottom:1px solid var(--rule)}
th{font-size:12px;color:var(--ink-2);font-weight:600}
td.r,th.r{text-align:right}
tfoot td{font-weight:700;border-bottom:0;border-top:2px solid var(--line)}
.tablewrap{overflow-x:auto}
.formula{display:flex;flex-wrap:wrap;align-items:center;gap:8px;font-size:14px;margin:12px 0 4px}
.formula span{border:1.5px solid var(--line);border-radius:6px;padding:4px 10px;background:var(--paper)}
.formula em{font-style:normal;color:var(--ink-2)}
.trend{display:flex;align-items:flex-end;gap:14px;height:130px;margin-top:12px}
.trend div{flex:1;display:flex;flex-direction:column;justify-content:flex-end;align-items:center;gap:6px;height:100%;font-size:12px;color:var(--ink-2)}
.trend b{display:block;width:100%;max-width:64px;background:var(--brand);border-radius:3px 3px 0 0}
.trend b.est{background:repeating-linear-gradient(-45deg,var(--brand) 0 5px,var(--brand-soft) 5px 10px)}
.trend strong{color:var(--ink);font-size:13px}

.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translate(-50%,20px);opacity:0;
  background:var(--ink);color:var(--paper);padding:11px 18px;border-radius:8px;font-weight:600;font-size:14px;transition:.25s;pointer-events:none;max-width:90vw}
.toast.on{opacity:1;transform:translate(-50%,0)}
footer{border-top:1px solid var(--rule);padding:18px 0 28px;font-size:12.5px;color:var(--ink-2)}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<header>
  <div class="wrap">
    <div class="bar">
      <a class="logo" href="#overview" aria-label="Hururuk"><span class="mark display">H</span><b class="display">Hururuk</b><small data-k="console"></small></a>
      <div class="spacer"></div>
      <div class="partner" id="partner"></div>
      <div class="lang" role="group" aria-label="Language">
        <button type="button" data-lang="ko">한국어</button>
        <button type="button" data-lang="en">English</button>
      </div>
    </div>
    <nav aria-label="Sections">
      <button type="button" data-view="overview" data-k="nav_overview"></button>
      <button type="button" data-view="titles" data-k="nav_titles"></button>
      <button type="button" data-view="add" data-k="nav_add"></button>
      <button type="button" data-view="settlement" data-k="nav_settle"></button>
    </nav>
  </div>
</header>

<main class="wrap">
  <!-- Overview -->
  <section id="view-overview">
    <span class="sample" data-k="sample"></span>
    <div class="hero">
      <h1 class="display" id="heroH"></h1>
      <p data-k="hero_p"></p>
      <div class="hbars" id="heroBars"></div>
      <button class="btn" type="button" data-go="settlement" data-k="hero_cta"></button>
    </div>
    <div class="stats" id="stats"></div>
    <div class="grid two">
      <div class="quiet chart">
        <h3 data-k="chart_h"></h3>
        <div class="meta" style="font-size:13px;color:var(--ink-2)" data-k="chart_p"></div>
        <div id="chart"></div>
      </div>
      <div class="quiet">
        <h3 data-k="pipe_h"></h3>
        <div class="pipe-mini" id="pipeMini" style="margin-top:12px"></div>
      </div>
    </div>
  </section>

  <!-- Titles -->
  <section id="view-titles" hidden>
    <h2 class="display" data-k="titles_h"></h2>
    <p class="lede" data-k="titles_p"></p>
    <div class="rows" id="rows"></div>
  </section>

  <!-- Add a title -->
  <section id="view-add" hidden>
    <h2 class="display" data-k="add_h"></h2>
    <p class="lede" data-k="add_p"></p>
    <form id="addForm" novalidate>
      <div class="frow">
        <label class="f"><span data-k="f_ko"></span><input type="text" id="fKo" autocomplete="off"></label>
        <label class="f"><span data-k="f_en"></span><input type="text" id="fEn" autocomplete="off"></label>
      </div>
      <div class="frow">
        <label class="f"><span data-k="f_genre"></span><select id="fGenre"></select></label>
        <label class="f"><span data-k="f_eps"></span><input type="number" id="fEps" min="1" inputmode="numeric"></label>
      </div>
      <fieldset>
        <legend data-k="f_rights"></legend>
        <label class="opt"><input type="radio" name="rights" value="world" checked><span data-k="r_world"></span></label>
        <label class="opt"><input type="radio" name="rights" value="na"><span data-k="r_na"></span></label>
        <label class="opt"><input type="radio" name="rights" value="sea"><span data-k="r_sea"></span></label>
      </fieldset>
      <div class="cost"><span data-k="cost_note"></span><b class="num">$0</b></div>
      <label class="opt"><input type="checkbox" id="fTerms"><span data-k="f_terms"></span></label>
      <p class="err" id="fErr" role="alert"></p>
      <div><button class="btn alt" type="submit" data-k="submit"></button></div>
    </form>
  </section>

  <!-- Settlement -->
  <section id="view-settlement" hidden>
    <span class="sample" data-k="sample"></span>
    <h2 class="display" data-k="settle_h"></h2>
    <p class="lede" data-k="settle_p"></p>
    <div class="formula" id="formula"></div>
    <div class="grid two" style="margin-top:18px">
      <div class="panel">
        <h3 data-k="stmt_h"></h3>
        <div class="tablewrap"><table id="stmt"></table></div>
        <p class="note" data-k="payout"></p>
      </div>
      <div class="panel">
        <h3 data-k="trend_h"></h3>
        <div class="trend" id="trend"></div>
      </div>
    </div>
  </section>
</main>

<footer><div class="wrap" data-k="footer"></div></footer>
<div class="toast" id="toast" role="status" aria-live="polite"></div>

  if (lang === 'ko') return n >= 1e4 ? nf(Math.round(n/1e4)) + '만' : nf(n);
  if (n >= 1e6) return (n/1e6).toFixed(2).replace(/\.?0+$/,'') + 'M';
  if (n >= 1e3) return Math.round(n/1e3) + 'K';
  return String(n);
};
const tName = x => lang === 'ko' ? x.ko : x.en;
const cover = (x, cls='') => `<div class="cover ${cls}" style="background:${x.c[0]};--c2:${x.c[1]}" aria-hidden="true">${x.img ? `<img src="${x.img}" alt="">` : `<span>${esc(tName(x))}</span>`}</div>`;
const esc = s => String(s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));

function renderStatic(){
  document.documentElement.lang = lang;
  document.querySelectorAll('[data-k]').forEach(el => { el.textContent = t(el.dataset.k); });
  document.getElementById('partner').innerHTML = t('partner');
  document.querySelectorAll('.lang button').forEach(b => b.setAttribute('aria-pressed', b.dataset.lang === lang));
  const g = document.getElementById('fGenre'), cur = g.value || 'romance';
  g.innerHTML = ['romance','action','fantasy','slice','drama','thriller'].map(k => `<option value="${k}">${t(k)}</option>`).join('');
  g.value = cur;
}

function renderOverview(){
  const all = titles();
  const views = all.reduce((a,x) => a + (x.views||0), 0);
  const live = all.filter(x => x.status === 3).length;
  const settle = views * RATE, prev = MONTHS[1].v;
  document.getElementById('heroH').textContent = t('hero_h', {n: usd(settle)});
  const top = all.filter(x => x.views > 0).sort((a,b) => b.views - a.views).slice(0,3), max = top[0].views;
  document.getElementById('heroBars').innerHTML = top.map(x => `
    <div class="hbar"><div class="t">${esc(tName(x))}</div>
    <div class="track"><div class="fill" style="width:${(x.views/max*100).toFixed(1)}%"></div></div>
    <div class="num">${usd(x.views*RATE)}</div></div>`).join('');

  document.getElementById('stats').innerHTML = [
    {k:'stat_views', v:nf(views)},
    {k:'stat_settle', v:usd(settle), d:t('vs_last',{p:Math.round((settle/prev-1)*100)})},
    {k:'stat_live', v:t('live_of',{a:live,b:all.length})},
    {k:'stat_countries', v:'14'}
  ].map(s => `<div class="quiet stat"><div class="k">${t(s.k)}</div><div class="v num">${s.v}</div>${s.d ? `<div class="d">${s.d}</div>` : ''}</div>`).join('');

  // chart
  const W = 600, H = 190, pl = 44, pr = 12, pt = 14, pb = 28, lo = 80000, hi = 160000;
  const xs = i => pl + i*(W-pl-pr)/(WEEKS.length-1), ys = v => pt + (1-(v-lo)/(hi-lo))*(H-pt-pb);
  const pts = WEEKS.map((v,i) => `${xs(i).toFixed(1)},${ys(v).toFixed(1)}`).join(' ');
  let grid = '';
  [80000,120000,160000].forEach(v => { grid += `<line x1="${pl}" x2="${W-pr}" y1="${ys(v)}" y2="${ys(v)}" stroke="var(--rule)"/><text x="${pl-8}" y="${ys(v)+4}" text-anchor="end" font-size="11" fill="var(--ink-2)">${big(v)}</text>`; });
  const labels = WEEKS.map((v,i) => `<text x="${xs(i)}" y="${H-8}" text-anchor="middle" font-size="11" fill="var(--ink-2)">${t('wk',{n:i+1})}</text>`).join('');
  const dots = WEEKS.map((v,i) => `<circle cx="${xs(i)}" cy="${ys(v)}" r="${i===WEEKS.length-1?5:3}" fill="${i===WEEKS.length-1?'var(--brand)':'var(--paper)'}" stroke="var(--brand)" stroke-width="2"><title>${nf(v)}</title></circle>`).join('');
  document.getElementById('chart').innerHTML = `<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="${t('chart_h')}">${grid}<polyline points="${pts}" fill="none" stroke="var(--brand)" stroke-width="2.5" stroke-linejoin="round"/>${dots}${labels}</svg>`;

  const inPipe = all.filter(x => x.status < 3);
  document.getElementById('pipeMini').innerHTML = inPipe.length ? inPipe.map(x => `
    <div class="pm">${cover(x,'sm')}<div><div style="font-weight:600">${esc(tName(x))}</div>
    <div style="font-size:13px;color:var(--ink-2)">${x.status === 1 ? t('pipe_review',{a:x.reviewed,b:x.eps}) : t('pipe_ai')}</div>
    <div class="steps" style="margin-top:6px">${stepBar(x)}</div></div></div>`).join('')
    : `<div style="color:var(--ink-2)">${t('pipe_none')}</div>`;
}

const stepBar = x => STEP_KEYS.map((k,i) => `<i class="${i < x.status || x.status === 3 ? 'done' : i === x.status ? 'now' : ''}"></i>`).join('');

function renderTitles(){
  document.getElementById('rows').innerHTML = titles().map(x => `
    <div class="row">${cover(x)}
      <div><div style="font-weight:600">${esc(tName(x))}</div><div class="meta">${esc(lang==='ko'?x.en:x.ko)}</div><div class="meta">${t(x.genre)}, ${t('eps',{n:x.eps})}</div></div>
      <div class="pipe"><div class="steps">${stepBar(x)}</div>
        <div class="slabels">${STEP_KEYS.map((k,i) => `<span class="${i===x.status?'cur':''}">${t(k)}</span>`).join('')}</div></div>
      <div class="vw"><b class="num">${x.views ? nf(x.views) : '–'}</b><span>${t('views_mo')}</span></div>
    </div>`).join('');
}

function renderSettlement(){
  const live = titles().filter(x => x.views > 0);
  const tot = live.reduce((a,x) => a + x.views, 0);
  document.getElementById('formula').innerHTML = `<span>${t('fx_pool')}</span><em>×</em><span>${t('fx_share')}</span><em>=</em><span><strong>${t('fx_rate',{r:RATE.toFixed(3)})}</strong></span>`;
  document.getElementById('stmt').innerHTML = `
    <thead><tr><th>${t('col_title')}</th><th class="r">${t('col_views')}</th><th class="r">${t('col_share')}</th><th class="r">${t('col_amount')}</th></tr></thead>
    <tbody>${live.map(x => `<tr><td>${esc(tName(x))}</td><td class="r num">${nf(x.views)}</td><td class="r num">${(x.views/tot*100).toFixed(1)}%</td><td class="r num">${usd(x.views*RATE)}</td></tr>`).join('')}</tbody>
    <tfoot><tr><td>${t('total')}</td><td class="r num">${nf(tot)}</td><td class="r num">100%</td><td class="r num">${usd(tot*RATE)}</td></tr></tfoot>`;
  const vals = MONTHS.map(m => m.v ?? tot*RATE), mx = Math.max(...vals);
  document.getElementById('trend').innerHTML = MONTHS.map((m,i) => `
    <div><strong class="num">${usd(vals[i])}</strong><b class="${m.v?'':'est'}" style="height:${(vals[i]/mx*85).toFixed(0)}%"></b>${t(m.k)}</div>`).join('');
}

function renderAll(){ renderStatic(); renderOverview(); renderTitles(); renderSettlement(); }

const VIEWS = ['overview','titles','add','settlement'];
function go(v, push=true){
  if (!VIEWS.includes(v)) v = 'overview';
  view = v;
  VIEWS.forEach(n => document.getElementById('view-'+n).hidden = n !== v);
  document.querySelectorAll('nav button').forEach(b => b.dataset.view === v ? b.setAttribute('aria-current','page') : b.removeAttribute('aria-current'));
  if (push) { try { history.replaceState(null,'','#'+v); } catch(e) {} }
  window.scrollTo(0,0);
}

document.addEventListener('click', e => {
  const b = e.target.closest('[data-view],[data-go],[data-pick],[data-lang]');
  if (!b) return;
  if (b.dataset.view) go(b.dataset.view);
  else if (b.dataset.go) go(b.dataset.go);
  else if (b.dataset.lang) { lang = b.dataset.lang; save(); renderAll(); }
});
document.querySelector('.logo').addEventListener('click', e => { e.preventDefault(); go('overview'); });

let toastT;
function toast(msg){ const el = document.getElementById('toast'); el.textContent = msg; el.classList.add('on'); clearTimeout(toastT); toastT = setTimeout(() => el.classList.remove('on'), 3200); }

document.getElementById('addForm').addEventListener('submit', e => {
  e.preventDefault();
  const ko = fKo.value.trim(), en = fEn.value.trim(), eps = parseInt(fEps.value, 10), err = document.getElementById('fErr');
  if (!ko || !en || !(eps > 0)) { err.textContent = t('err_required'); return; }
  if (!fTerms.checked) { err.textContent = t('err_terms'); return; }
  err.textContent = '';
  added.push({id:'n'+Date.now(), en, ko, genre:fGenre.value, eps, status:0, views:0, c:PALETTES[(added.length+5) % PALETTES.length]});
  save(); e.target.reset(); renderAll(); go('titles'); toast(t('toast_ok'));
});

renderAll();
go((location.hash || '').replace('#',''), false);
</script>
</body>
</html>
